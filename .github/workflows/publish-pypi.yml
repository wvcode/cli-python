name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/

      - name: Run tests
        run: pytest --cov

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # O setuptools-scm tira a versão da tag: precisa do histórico todo.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build

      - name: Check package metadata
        run: |
          pip install twine
          twine check dist/*

      # O setuptools-scm só gera X.Y.Z no commit exato da tag vX.Y.Z. Fora dele
      # (ex.: "Run workflow" manual a partir de main), a versão sai como
      # X.Y.Z.devN+gHASH, que o PyPI recusa só no upload. Falha aqui, antes.
      - name: Check that the version matches the release tag
        run: |
          VERSION=$(ls dist/*.whl | sed -E 's|^dist/datatool_cli-([^-]+)-.*$|\1|')
          echo "Versão construída: $VERSION (ref: $GITHUB_REF_TYPE $GITHUB_REF_NAME)"
          if [ "$GITHUB_REF_TYPE" != "tag" ] || [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::A versão construída ($VERSION) não corresponde à tag da release ($GITHUB_REF_NAME). Publique criando uma release com a tag vX.Y.Z no commit desejado."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/datatool-cli
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
