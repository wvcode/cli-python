[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "datatool-cli"
# Vem da tag do git (setuptools-scm): a tag v0.2.0 publica a versão 0.2.0.
dynamic = ["version"]
description = "Diagnostica, perfila, limpa e converte arquivos de dados (CSV, Excel, JSON, Parquet) pela linha de comando, com suporte nativo a CSV do Excel brasileiro, CPF/CNPJ e R$."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "WVCode", email = "contato@wvcode.com.br" }]
requires-python = ">=3.10"
keywords = [
    "csv",
    "excel",
    "parquet",
    "data-cleaning",
    "data-quality",
    "profiling",
    "polars",
    "cpf",
    "cnpj",
    "mcp",
]
# Sem classificador de licença: com `license` no formato SPDX (PEP 639), o
# setuptools recusa os dois juntos.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: Portuguese (Brazilian)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Utilities",
]
# Mínimos verificados rodando a suíte com `uv pip install --resolution
# lowest-direct` (ver o job `test-minimum` do CI).
dependencies = [
    # 0.16: primeira versão compatível com click >= 8.2 (com o 0.12, o --help
    # quebra quando o pip instala o click atual).
    "typer>=0.16",
    # 1.27.1: lendo o arquivo inteiro (DT28), versões anteriores transformam em
    # nulo os números de uma coluna JSONL que também tem texto (antes da 1.3,
    # o read_ndjson nem aceita `infer_schema_length`).
    "polars>=1.27.1",
    "fastexcel>=0.10",
    "xlsxwriter>=3.0",
    "platformdirs>=3.0",
]

[project.optional-dependencies]
# Servidor MCP (spec 020) — dependência pesada (uvicorn, pydantic,
# cryptography, ...) que só quem usa agentes de IA precisa instalar.
mcp = ["mcp>=2.0"]
dev = [
    "datatool-cli[mcp]",
    # Os testes usam `result.stderr` separado do stdout: click >= 8.2, e o
    # CliRunner do 8.2.0 não captura o stderr (corrigido no 8.2.1).
    "click>=8.2.1",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[project.urls]
Homepage = "https://github.com/wvcode/cli-python"
"Bug Tracker" = "https://github.com/wvcode/cli-python/issues"
Changelog = "https://github.com/wvcode/cli-python/blob/main/CHANGELOG.md"

[project.scripts]
datatool = "datatool.main:app"
datatool-mcp = "datatool.mcp_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
# Sem histórico do git (ex.: tarball sem .git), em vez de falhar o build.
fallback_version = "0.1.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Avisos de mudança futura (ex.: polars 2.0) quebram a suíte em vez de passar
# despercebidos no meio da saída (DT24).
filterwarnings = ["error::FutureWarning"]

[tool.coverage.run]
source = ["datatool"]

[tool.coverage.report]
show_missing = true
# Cobertura atual ~97%; o CI falha se cair abaixo disto.
fail_under = 95

[tool.pyright]
include = ["src"]
typeCheckingMode = "basic"
pythonVersion = "3.10"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
